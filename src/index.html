<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contracorriente</title>
<meta name="theme-color" content="#0d0a20">
<meta name="description" content="Todos caen a la vez por el mismo túnel. En cada bifurcación se derrumba el camino con más gente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;600;700;800&family=Chivo+Mono:wght@500;700&display=swap">
<style>/*__CSS__*/</style>
</head>
<body>
<canvas id="game" aria-label="Túnel de juego"></canvas>
<div id="flash" class="flash"></div>

<div id="hud" class="hud" hidden>
  <div class="hud-pill">
    <span class="lbl">Vivos</span>
    <span id="hAlive" class="num">0</span>
  </div>
  <div id="hForks" class="hud-forks" role="img" aria-label="Bifurcaciones superadas"></div>
  <div class="hud-pill end">
    <span class="lbl">Puntos</span>
    <span class="hud-score"><span id="hCombo" class="combo" hidden></span><span id="hScore" class="num">0</span></span>
  </div>
</div>
<div id="banner" class="banner" hidden><div id="bTitle" class="b-title"></div><div id="bSub" class="b-sub"></div></div>
<div id="hint" class="hint" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="spect" class="spect" hidden>
  <p id="spectText"></p>
  <button id="skip" class="btn btn-ghost btn-sm" type="button">Ver resultado</button>
</div>

<section id="menu" class="screen menu" aria-labelledby="logo">
  <header class="topbar">
    <button id="profileBtn" class="chip-profile" type="button" aria-label="Ver perfil">
      <span class="ring" aria-hidden="true">
        <svg viewBox="0 0 40 40"><circle class="ring-bg" cx="20" cy="20" r="17"/><circle id="ringFill" class="ring-fg" cx="20" cy="20" r="17"/></svg>
        <b id="pLevel">1</b>
      </span>
      <span class="chip-text"><strong id="pTitle">Chispa</strong><small id="pXp">0 / 120 XP</small></span>
    </button>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
    </button>
  </header>

  <div class="menu-main">
    <p class="eyebrow">Temporada beta · v0.3</p>
    <h1 id="logo" class="logo"><span class="l1">Contra</span><span class="l2">corriente</span></h1>
    <p class="tagline">Todos caen a la vez. Sobrevive el que no sigue a la masa.</p>
    <button id="play" class="btn-play" type="button">Jugar</button>
    <p class="online"><span class="live-dot" aria-hidden="true"></span><span id="lobbyCount">1.201</span> en la sala · bots simulados</p>
    <nav class="menu-grid" aria-label="Secciones">
      <button class="tile" type="button" data-open="how">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"/><path d="M12 17h.01"/></svg>
        <span>Reglas</span><small>4 pasos</small>
      </button>
      <button class="tile" type="button" data-open="skins">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c4-1 7.5-4 9.5-8"/><circle cx="16" cy="8" r="4"/></svg>
        <span>Estelas</span><small id="tSkins">1/6</small>
      </button>
      <button class="tile" type="button" data-open="ach">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>
        <span>Logros</span><small id="tAch">0/14</small>
      </button>
      <button class="tile" type="button" data-open="records">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>
        <span>Récords</span><small id="tRec">—</small>
      </button>
    </nav>
  </div>

  <footer class="menu-stats">
    <div class="mstat"><b id="sBest">—</b><span>Mejor</span></div>
    <div class="mstat"><b id="sRounds">0</b><span>Rondas</span></div>
    <div class="mstat"><b id="sStreak">0</b><span>Racha</span></div>
    <div class="mstat"><b id="sOutliers">0</b><span>Outlier</span></div>
  </footer>
</section>

<section id="results" class="screen results" hidden aria-labelledby="rRank">
  <div class="card">
    <div class="res-head">
      <p id="rEyebrow" class="eyebrow">Fin de la ronda</p>
      <div class="rank-line"><span id="rRank" class="big">#1</span><span id="rOf" class="of">de 1.201</span></div>
      <p id="rPct" class="pct"></p>
      <p id="rWhy" class="why"></p>
    </div>
    <dl class="kv">
      <div><dt>Caminos</dt><dd id="rForks">0/6</dd></div>
      <div><dt>Puntos</dt><dd id="rScore">0</dd></div>
      <div><dt>Justas</dt><dd id="rNear">0</dd></div>
      <div><dt>Chispas</dt><dd id="rOrbs">0</dd></div>
    </dl>
    <div class="xp">
      <div class="xp-top"><strong id="rXp">+0 XP</strong><span id="rLevel">Nivel 1 · Chispa</span></div>
      <div class="xpbar"><span id="rXpFill"></span></div>
      <p id="rUnlock" class="unlock" hidden></p>
    </div>
    <div id="rAch" class="ach-earned" hidden></div>
    <div class="outlier">
      <span class="lbl">Outlier del minuto</span>
      <strong id="rOutlier"></strong>
    </div>
    <div class="actions">
      <button id="again" class="btn btn-primary" type="button">Jugar otra <span id="rNext" class="count-pill">10</span></button>
      <div class="row">
        <button id="shareBtn" class="btn btn-ghost" type="button">Compartir</button>
        <button id="home" class="btn btn-ghost" type="button">Menú</button>
      </div>
    </div>
  </div>
</section>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="sheet-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" type="button" data-close aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="modalBody" class="sheet-body"></div>
  </div>
</div>

<script>/*__JS__*/</script>
</body>
</html>
